<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1080" viewBox="0 0 1400 1080">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #16324f; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #355070; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #102a43; }
      .box-text { font: 400 15px Arial, sans-serif; fill: #243b53; }
      .small { font: 400 13px Arial, sans-serif; fill: #486581; }
      .arrow { stroke: #486581; stroke-width: 3; fill: none; marker-end: url(#arrowhead2); }
      .lane { fill: #f7fafc; stroke: #cbd2d9; stroke-width: 2; rx: 18; }
      .box-blue { fill: #e8f1fb; stroke: #7aa5d2; stroke-width: 2; rx: 16; }
      .box-green { fill: #e7f7ef; stroke: #6bbf8b; stroke-width: 2; rx: 16; }
      .box-orange { fill: #fff3e8; stroke: #f4a261; stroke-width: 2; rx: 16; }
      .box-purple { fill: #f2ecff; stroke: #9b87f5; stroke-width: 2; rx: 16; }
    </style>
    <marker id="arrowhead2" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#486581"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1360" height="1040" fill="#ffffff" stroke="#d9e2ec" stroke-width="2" rx="24"/>
  <text x="50" y="70" class="title">Workflow Infer: dl_stereo_matching_pytorch</text>
  <text x="50" y="100" class="subtitle">Luồng chi tiết từ CLI infer đến load checkpoint, trích feature map, build cost volume và lưu disparity PNG</text>

  <rect x="40" y="130" width="1320" height="220" class="lane"/>
  <text x="60" y="165" class="box-title">1. Entry và chọn danh sách ảnh test</text>

  <rect x="70" y="200" width="260" height="110" class="box-blue"/>
  <text x="90" y="230" class="box-title">CLI entry</text>
  <text x="90" y="258" class="box-text">python -m dl_stereo_matching_pytorch.infer</text>
  <text x="90" y="282" class="small">infer.py:85 -> main()</text>

  <rect x="370" y="200" width="260" height="110" class="box-blue"/>
  <text x="390" y="230" class="box-title">parse_args()</text>
  <text x="390" y="258" class="box-text">model-dir, out-dir, data-root,</text>
  <text x="390" y="280" class="box-text">disp-range, num-imgs, start-id</text>
  <text x="390" y="302" class="small">infer.py:14-26</text>

  <rect x="670" y="200" width="300" height="110" class="box-blue"/>
  <text x="690" y="230" class="box-title">Chọn mode đọc data</text>
  <text x="690" y="258" class="box-text">Có myPerm.bin -> preprocess mode</text>
  <text x="690" y="280" class="box-text">Không có -> KITTI raw testing/*_10.png</text>
  <text x="690" y="302" class="small">infer.py:40-54</text>

  <rect x="1010" y="200" width="300" height="110" class="box-blue"/>
  <text x="1030" y="230" class="box-title">Resolve sample list</text>
  <text x="1030" y="258" class="box-text">sample_keys = file_ids hoặc stems</text>
  <text x="1030" y="280" class="box-text">đồng thời xác định in_channels</text>
  <text x="1030" y="302" class="small">infer.py:42-55</text>

  <path d="M330 255 H370" class="arrow"/>
  <path d="M630 255 H670" class="arrow"/>
  <path d="M970 255 H1010" class="arrow"/>

  <rect x="40" y="380" width="1320" height="210" class="lane"/>
  <text x="60" y="415" class="box-title">2. Load checkpoint và model</text>

  <rect x="120" y="450" width="300" height="100" class="box-green"/>
  <text x="140" y="480" class="box-title">Load checkpoint.pt</text>
  <text x="140" y="508" class="box-text">torch.load(model_dir / checkpoint.pt)</text>
  <text x="140" y="530" class="small">infer.py:57</text>

  <rect x="500" y="450" width="300" height="100" class="box-green"/>
  <text x="520" y="480" class="box-title">create_model()</text>
  <text x="520" y="508" class="box-text">SiameseStereoMatching(net_type, in_channels)</text>
  <text x="520" y="530" class="small">infer.py:59, models.py:80</text>

  <rect x="880" y="450" width="300" height="100" class="box-green"/>
  <text x="900" y="480" class="box-title">Restore weights</text>
  <text x="900" y="508" class="box-text">load_state_dict() + model.eval()</text>
  <text x="900" y="530" class="small">infer.py:60-61</text>

  <path d="M420 500 H500" class="arrow"/>
  <path d="M800 500 H880" class="arrow"/>

  <rect x="40" y="620" width="1320" height="390" class="lane"/>
  <text x="60" y="655" class="box-title">3. Full-image inference cho từng sample</text>

  <rect x="70" y="700" width="230" height="130" class="box-purple"/>
  <text x="90" y="730" class="box-title">Đọc ảnh trái/phải</text>
  <text x="90" y="758" class="box-text">read_stereo_pair() hoặc</text>
  <text x="90" y="780" class="box-text">read_stereo_pair_by_name()</text>
  <text x="90" y="802" class="small">infer.py:65-75</text>

  <rect x="330" y="700" width="230" height="130" class="box-purple"/>
  <text x="350" y="730" class="box-title">Convert to tensor</text>
  <text x="350" y="758" class="box-text">HWC -> CHW</text>
  <text x="350" y="780" class="box-text">unsqueeze batch dim</text>
  <text x="350" y="802" class="small">infer.py:74-75</text>

  <rect x="590" y="700" width="230" height="130" class="box-purple"/>
  <text x="610" y="730" class="box-title">Feature extraction</text>
  <text x="610" y="758" class="box-text">model.extract_feature_maps()</text>
  <text x="610" y="780" class="box-text">left_features, right_features</text>
  <text x="610" y="802" class="small">infer.py:77</text>

  <rect x="850" y="700" width="230" height="130" class="box-purple"/>
  <text x="870" y="730" class="box-title">Build cost volume</text>
  <text x="870" y="758" class="box-text">build_cost_volume()</text>
  <text x="870" y="780" class="box-text">dịch feature phải theo disparity</text>
  <text x="870" y="802" class="small">infer.py:78, models.py:89-101</text>

  <rect x="1110" y="700" width="210" height="130" class="box-purple"/>
  <text x="1130" y="730" class="box-title">Argmax disparity</text>
  <text x="1130" y="758" class="box-text">cost_volume.argmax(dim=1)</text>
  <text x="1130" y="780" class="box-text">ra disparity map</text>
  <text x="1130" y="802" class="small">infer.py:79</text>

  <path d="M300 765 H330" class="arrow"/>
  <path d="M560 765 H590" class="arrow"/>
  <path d="M820 765 H850" class="arrow"/>
  <path d="M1080 765 H1110" class="arrow"/>

  <rect x="400" y="870" width="600" height="100" class="box-orange"/>
  <text x="420" y="900" class="box-title">Save output PNG</text>
  <text x="420" y="928" class="box-text">save_disparity(out_dir / f"disp_map_&lt;sample&gt;.png", disparity, disp_range)</text>
  <text x="420" y="950" class="small">infer.py:29-32, infer.py:81-82</text>

  <path d="M1215 830 V870 H700" class="arrow"/>
</svg>
