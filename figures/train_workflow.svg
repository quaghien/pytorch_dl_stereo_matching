<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1320" viewBox="0 0 1400 1320">
  <defs>
    <style>
      .title { font: 700 28px Arial, sans-serif; fill: #16324f; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #355070; }
      .box-title { font: 700 18px Arial, sans-serif; fill: #102a43; }
      .box-text { font: 400 15px Arial, sans-serif; fill: #243b53; }
      .small { font: 400 13px Arial, sans-serif; fill: #486581; }
      .arrow { stroke: #486581; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .lane { fill: #f7fafc; stroke: #cbd2d9; stroke-width: 2; rx: 18; }
      .box-blue { fill: #e8f1fb; stroke: #7aa5d2; stroke-width: 2; rx: 16; }
      .box-green { fill: #e7f7ef; stroke: #6bbf8b; stroke-width: 2; rx: 16; }
      .box-orange { fill: #fff3e8; stroke: #f4a261; stroke-width: 2; rx: 16; }
      .box-purple { fill: #f2ecff; stroke: #9b87f5; stroke-width: 2; rx: 16; }
      .box-gray { fill: #f4f6f8; stroke: #9fb3c8; stroke-width: 2; rx: 16; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#486581"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="1360" height="1280" fill="#ffffff" stroke="#d9e2ec" stroke-width="2" rx="24"/>
  <text x="50" y="70" class="title">Workflow Train: dl_stereo_matching_pytorch</text>
  <text x="50" y="100" class="subtitle">Luồng chi tiết từ CLI train đến dataset, model, loss, optimizer, checkpoint và train.log</text>

  <rect x="40" y="130" width="1320" height="230" class="lane"/>
  <text x="60" y="165" class="box-title">1. Entry và setup trong train.py</text>

  <rect x="70" y="190" width="280" height="120" class="box-blue"/>
  <text x="90" y="220" class="box-title">CLI entry</text>
  <text x="90" y="248" class="box-text">python -m dl_stereo_matching_pytorch.train</text>
  <text x="90" y="272" class="small">train.py:175 -> main()</text>
  <text x="90" y="294" class="small">train.py:15 parse_args()</text>

  <rect x="400" y="190" width="280" height="120" class="box-blue"/>
  <text x="420" y="220" class="box-title">Validate config</text>
  <text x="420" y="248" class="box-text">validate_patch_size(net_type, patch_size)</text>
  <text x="420" y="272" class="small">train.py:39</text>
  <text x="420" y="294" class="small">models.py:26 get_network_spec()</text>

  <rect x="730" y="190" width="280" height="120" class="box-blue"/>
  <text x="750" y="220" class="box-title">Prepare output</text>
  <text x="750" y="248" class="box-text">model_dir, train.log, TeeStream</text>
  <text x="750" y="272" class="small">train.py:107-120</text>
  <text x="750" y="294" class="small">stdout + file log cùng lúc</text>

  <rect x="1060" y="190" width="250" height="120" class="box-blue"/>
  <text x="1080" y="220" class="box-title">Run training</text>
  <text x="1080" y="248" class="box-text">run_training(args, model_dir)</text>
  <text x="1080" y="272" class="small">train.py:124</text>

  <path d="M350 250 H400" class="arrow"/>
  <path d="M680 250 H730" class="arrow"/>
  <path d="M1010 250 H1060" class="arrow"/>

  <rect x="40" y="390" width="1320" height="290" class="lane"/>
  <text x="60" y="425" class="box-title">2. Build dataset trong data.py</text>

  <rect x="70" y="460" width="280" height="150" class="box-green"/>
  <text x="90" y="490" class="box-title">build_patch_datasets()</text>
  <text x="90" y="518" class="box-text">train.py:127 gọi data.py:299</text>
  <text x="90" y="542" class="box-text">Quyết định nhánh preprocess cũ</text>
  <text x="90" y="564" class="box-text">hay KITTI raw hiện tại</text>

  <rect x="400" y="460" width="280" height="150" class="box-green"/>
  <text x="420" y="490" class="box-title">RawKittiStereoCache</text>
  <text x="420" y="518" class="box-text">data.py:165-199</text>
  <text x="420" y="542" class="box-text">Đọc training/image_0, image_1,</text>
  <text x="420" y="564" class="box-text">disp_noc và normalize ảnh</text>
  <text x="420" y="586" class="small">read_stereo_pair_by_name(), read_disparity_png()</text>

  <rect x="730" y="460" width="280" height="150" class="box-green"/>
  <text x="750" y="490" class="box-title">RawKittiPatchDataset</text>
  <text x="750" y="518" class="box-text">data.py:202-296</text>
  <text x="750" y="542" class="box-text">_build_index() lọc pixel disparity</text>
  <text x="750" y="564" class="box-text">hợp lệ theo patch_size và disp_range</text>
  <text x="750" y="586" class="box-text">__getitem__() cắt left/right patch</text>

  <rect x="1060" y="460" width="250" height="150" class="box-green"/>
  <text x="1080" y="490" class="box-title">Target distribution</text>
  <text x="1080" y="518" class="box-text">build_target_distribution()</text>
  <text x="1080" y="542" class="box-text">[0.05, 0.2, 0.5, 0.2, 0.05]</text>
  <text x="1080" y="564" class="small">data.py:78-87</text>

  <path d="M350 535 H400" class="arrow"/>
  <path d="M680 535 H730" class="arrow"/>
  <path d="M1010 535 H1060" class="arrow"/>

  <rect x="40" y="710" width="1320" height="240" class="lane"/>
  <text x="60" y="745" class="box-title">3. Build model trong models.py</text>

  <rect x="70" y="780" width="280" height="120" class="box-purple"/>
  <text x="90" y="810" class="box-title">create_model()</text>
  <text x="90" y="838" class="box-text">train.py:140 -> models.py:80</text>
  <text x="90" y="862" class="box-text">Khởi tạo SiameseStereoMatching</text>

  <rect x="400" y="780" width="280" height="120" class="box-purple"/>
  <text x="420" y="810" class="box-title">NetworkSpec</text>
  <text x="420" y="838" class="box-text">models.py:20-23</text>
  <text x="420" y="862" class="box-text">win19_dep9 hoặc win37_dep9</text>

  <rect x="730" y="780" width="280" height="120" class="box-purple"/>
  <text x="750" y="810" class="box-title">SiameseFeatureExtractor</text>
  <text x="750" y="838" class="box-text">models.py:33-48</text>
  <text x="750" y="862" class="box-text">Conv2d + BatchNorm2d + ReLU</text>

  <rect x="1060" y="780" width="250" height="120" class="box-purple"/>
  <text x="1080" y="810" class="box-title">Forward head</text>
  <text x="1080" y="838" class="box-text">models.py:65-77</text>
  <text x="1080" y="862" class="box-text">Inner product bằng einsum</text>

  <path d="M350 840 H400" class="arrow"/>
  <path d="M680 840 H730" class="arrow"/>
  <path d="M1010 840 H1060" class="arrow"/>

  <rect x="40" y="980" width="1320" height="280" class="lane"/>
  <text x="60" y="1015" class="box-title">4. Training loop, loss, optimizer, checkpoint</text>

  <rect x="70" y="1050" width="250" height="160" class="box-orange"/>
  <text x="90" y="1080" class="box-title">DataLoader</text>
  <text x="90" y="1108" class="box-text">make_loader()</text>
  <text x="90" y="1130" class="box-text">infinite_loader()</text>
  <text x="90" y="1152" class="small">train.py:45-52</text>

  <rect x="350" y="1050" width="250" height="160" class="box-orange"/>
  <text x="370" y="1080" class="box-title">Optimizer + LR</text>
  <text x="370" y="1108" class="box-text">build_optimizer()</text>
  <text x="370" y="1130" class="box-text">update_learning_rate()</text>
  <text x="370" y="1152" class="small">train.py:84-101</text>

  <rect x="630" y="1050" width="250" height="160" class="box-orange"/>
  <text x="650" y="1080" class="box-title">Per-step compute</text>
  <text x="650" y="1108" class="box-text">model(left, right)</text>
  <text x="650" y="1130" class="box-text">soft_target_cross_entropy()</text>
  <text x="650" y="1152" class="box-text">loss.backward(), optimizer.step()</text>
  <text x="650" y="1174" class="small">train.py:147-158, models.py:84-86</text>

  <rect x="910" y="1050" width="180" height="160" class="box-orange"/>
  <text x="930" y="1080" class="box-title">Periodic log</text>
  <text x="930" y="1108" class="box-text">Mỗi eval_every step</text>
  <text x="930" y="1130" class="box-text">print(step, loss, lr)</text>
  <text x="930" y="1152" class="small">train.py:160-165</text>

  <rect x="1120" y="1050" width="210" height="160" class="box-orange"/>
  <text x="1140" y="1080" class="box-title">Save artifact</text>
  <text x="1140" y="1108" class="box-text">checkpoint.pt</text>
  <text x="1140" y="1130" class="box-text">config.json</text>
  <text x="1140" y="1152" class="box-text">train.log</text>
  <text x="1140" y="1174" class="small">save_checkpoint(): train.py:70-81</text>

  <path d="M320 1130 H350" class="arrow"/>
  <path d="M600 1130 H630" class="arrow"/>
  <path d="M880 1130 H910" class="arrow"/>
  <path d="M1090 1130 H1120" class="arrow"/>
</svg>
